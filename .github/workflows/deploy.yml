# Every push to main uploads the site to Hostlab over FTPS (only changed files).
# Repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD. The FTP account's home directory must be public_html.
# Build locally (python tools/build.py .) and commit the output; this workflow only uploads.
name: Hostlab'a yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            **/__pycache__/**
            CNAME
